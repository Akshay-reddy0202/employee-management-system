<section class="forgotPassword">
  <div
    class="forgotPassword__card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="forgotPassword-title"
    aria-describedby="forgotPassword-description"
    cdkTrapFocus
  >
    <header class="forgotPassword__header">
      <h2 class="forgotPassword__title" id="forgotPassword-title">Forgot Password</h2>
      <p class="forgotPassword__subtitle" id="forgotPassword-description">
        Enter your registered email address to continue.
      </p>
    </header>

    <form class="forgotPassword__form" [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
      <div class="forgotPassword__form-content">
        <label for="emailID" class="forgotPassword__label">Email address</label>
        <input
          #emailInput
          type="email"
          name="emailID"
          id="emailID"
          class="forgotPassword__input"
          placeholder="Enter your email address"
          formControlName="emailID"
          autocomplete="email"
          [attr.aria-invalid]="emailID?.invalid && emailID?.touched"
          [attr.aria-describedby]="getEmailIDError()"
        />
        @if (emailID?.hasError('required') && emailID?.touched) {
          <p class="forgotPassword__errors" role="alert" id="emailID-required-error">
            Email address is required.
          </p>
        }

        @if (emailID?.hasError('email') && emailID?.touched) {
          <p class="forgotPassword__errors" role="alert" id="emailID-email-error">
            Please enter a valid email address.
          </p>
        }
      </div>

      <div class="forgotPassword__actions">
        <button type="button" class="forgotPassword__button-secondary" (click)="onCancel()">
          Cancel
        </button>
        <button
          type="submit"
          class="forgotPassword__button-primary"
          [disabled]="forgotPasswordForm.invalid"
        >
          Continue
        </button>
      </div>
    </form>
  </div>
</section>
