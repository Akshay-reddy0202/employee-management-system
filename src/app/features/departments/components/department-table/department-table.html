<section class="departments__content">
  <table class="departments__table">
    <thead class="departments__table-head">
      <tr class="departments__table-row">
        <th class="department-table__sortable-header" (click)="onSort('code')">
          <span>Code</span>
          <mat-icon class="department-table__sort-icon">
            {{ getSortIcon('code') }}
          </mat-icon>
        </th>
        <th (click)="onSort('name')" class="department-table__sortable-header">
          <span>Name</span>
          <mat-icon class="department-table__sort-icon">
            {{ getSortIcon('name') }}
          </mat-icon>
        </th>
        <th (click)="onSort('description')" class="department-table__sortable-header">
          <span>Description</span
          ><mat-icon class="department-table__sort-icon">
            {{ getSortIcon('description') }}
          </mat-icon>
        </th>
        <th>Employees</th>
        <th (click)="onSort('status')">Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody class="departments__table-body">
      @for (department of departments(); track department.id) {
        <tr class="departments__table-row">
          <td>{{ department.code }}</td>
          <td>{{ department.name }}</td>
          <td>{{ department.description }}</td>
          <td></td>
          <td>{{ department.status }}</td>
          <td class="departments__table-actions">
            <button
              type="button"
              class="departments__action-button departments__action-button--edit"
              (click)="onEditClick(department)"
            >
              <mat-icon>edit</mat-icon>
            </button>

            <button
              type="button"
              class="departments__action-button departments__action-button--delete"
              (click)="onDeleteClick(department)"
            >
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</section>
