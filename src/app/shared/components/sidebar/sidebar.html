<aside class="sidebar" [class.sidebar--open]="sidebarService.isSidebarOpen()">
  <header class="sidebar__header">
    <h2 class="sidebar__title">Employee Management System</h2>
    <button class="sidebar__close" (click)="closeSidebar()">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="sidebar__close-icon"
      >
        <path d="M18 6 6 18" />
        <path d="m6 6 12 12" />
      </svg>
    </button>
  </header>

  <nav class="sidebar__navigation">
    <a href="" class="sidebar__item">Dashboard</a>
    <a href="" class="sidebar__item">Employees</a>
    <a href="" class="sidebar__item">Attendance</a>
    <a href="" class="sidebar__item">Payroll</a>
    <a href="" class="sidebar__item">Application</a>
  </nav>
</aside>
