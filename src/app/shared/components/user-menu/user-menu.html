<div class="user-menu">
  <div class="user-menu__avatar">
    <p class="user-menu__avatar-text">{{ authService.loggedInUser()?.fullName | initialsPipe }}</p>
    <div class="user-menu__avatar-tooltip">
      <p class="user-menu__avatar-name">{{ authService.loggedInUser()?.fullName }}</p>
    </div>
  </div>

  <div class="user-menu__role" [appClickOutside]="isMenuOpen()" (clickOutside)="closeMenu()">
    <button class="user-menu__role-button" (click)="toggleDropdown()">
      <span class="user-menu__role-text">{{ authService.loggedInUser()?.role }}</span>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="user-menu__role-icon"
      >
        <path d="m6 9 6 6 6-6" />
      </svg>
    </button>
    @if (isMenuOpen()) {
      <div class="user-menu__dropdown">
        <button class="user-menu__dropdown-item" (click)="goToProfile()">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="user-menu__dropdown-icon"
          >
            <circle cx="12" cy="12" r="10" />
            <circle cx="12" cy="10" r="3" />
            <path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662" />
          </svg>

          Profile
        </button>

        <button class="user-menu__dropdown-item" (click)="goToSettings()">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="user-menu__dropdown-icon"
          >
            <path
              d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"
            />
            <circle cx="12" cy="12" r="3" />
          </svg>

          Settings
        </button>
        <button class="user-menu__dropdown-item" (click)="openLogoutDialog()">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="user-menu__dropdown-icon"
          >
            <path d="m16 17 5-5-5-5" />
            <path d="M21 12H9" />
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          </svg>

          Logout
        </button>
        @if (isConfirmationDialogOpen()) {
          <app-confirmation-dialog
            title="Logout"
            message="Are you sure you want to logout? You will need to sign in again to access your account."
            confirmText="Logout"
            cancelText="Stay Logged In"
            (confirm)="logout()"
            (cancel)="closeLogoutDialog()"
            variant="danger"
          >
          </app-confirmation-dialog>
        }
      </div>
    }
  </div>
</div>
