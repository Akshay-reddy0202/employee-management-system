name: EMS CI/CD

on:
  push:
    branches:
      - feature/real-backend

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Backend build
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      # Frontend build
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Authenticate with AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build and push backend image
      - name: Build and push backend Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/ems-backend:$IMAGE_TAG \
            -t $REGISTRY/ems-backend:latest \
            ./backend

          docker push $REGISTRY/ems-backend:$IMAGE_TAG
          docker push $REGISTRY/ems-backend:latest

      # Build and push frontend image
      - name: Build and push frontend Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/ems-frontend:$IMAGE_TAG \
            -t $REGISTRY/ems-frontend:latest \
            ./frontend

          docker push $REGISTRY/ems-frontend:$IMAGE_TAG
          docker push $REGISTRY/ems-frontend:latest