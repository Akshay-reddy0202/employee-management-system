server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Send API requests to the backend Kubernetes Service
    location /api/ {
        proxy_pass http://backend-service:3000;
    }

    # Angular SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
